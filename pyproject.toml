[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soscleaner"
version = "0.5.0"
description = "To clean and filter sensitive data from a standard sosreport or any data files"
readme = "README.md"
license = {text = "GPLv2+"}
authors = [
    {name = "Jamie Duncan", email = "jduncan@redhat.com"}
]
maintainers = [
    {name = "Jamie Duncan", email = "jduncan@redhat.com"}
]
keywords = ["sosreport", "obfuscation", "security", "redhat", "sensitive-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage",
    "coveralls",
    "bump2version",
    "build",
    "mkdocs",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "coverage",
]

[project.scripts]
soscleaner = "soscleaner.cli:main"

[project.urls]
Homepage = "https://github.com/jduncan-rva/soscleaner"
Documentation = "https://soscleaner.readthedocs.io"
Repository = "https://github.com/jduncan-rva/soscleaner"
Issues = "https://github.com/jduncan-rva/soscleaner/issues"
Changelog = "https://github.com/jduncan-rva/soscleaner/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["soscleaner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["soscleaner"]
branch = true
omit = [
    "*/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.bumpversion]
current_version = "0.5.0"
commit = false
tag = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "soscleaner/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "soscleaner/soscleaner.py"

[[tool.bumpversion.files]]
filename = "soscleaner/cli.py"

[[tool.bumpversion.files]]
filename = "soscleaner.spec"

[[tool.bumpversion.files]]
filename = "docs/conf.py"
